<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EMC Study Hub</title><style>body{font:18px system-ui;background:#edf3f6;color:#18354a;max-width:700px;margin:auto;padding:24px}section{background:white;padding:24px;border-radius:16px}button{display:block;width:100%;padding:14px;margin:10px 0;border:1px solid #aabcc9;border-radius:10px;background:white;font:inherit;text-align:start}button:focus-visible{outline:3px solid teal}.right{background:#d5f5df}.wrong{background:#ffdede}button[hidden]{display:none}</style><h1>EMC Study Hub</h1><p dir="rtl" lang="ar">منصة تعليمية لطلاب الطوارئ الطبية</p><small>Educational prototype only — not clinical guidance.</small><p id="progress"></p><section><h2 id="question"></h2><p id="arabic" dir="rtl" lang="ar"></p><div id="choices"></div><p id="feedback" role="status"></p><button id="next" hidden>Next / التالي</button></section><p id="score"></p><button id="restart">Restart / إعادة الاختبار</button><script>
const items=[
['What does ABCDE stand for?','ماذا يعني اختصار ABCDE؟',['Airway, Breathing, Circulation, Disability, Exposure','Airway, Blood pressure, Cardiac output, Drugs, ECG','Alertness, Breathing, Chest, Dressing, Examination'],0,'ABCDE structures the initial assessment.'],
['A patient has an obstructed airway. Which assessment category is this?','مريض لديه انسداد في مجرى الهواء. لأي فئة ينتمي؟',['Circulation','Airway','Exposure'],1,'Airway patency belongs to A.'],
['Which observation belongs to Breathing?','أي ملاحظة تتعلق بتقييم التنفس؟',['Respiratory rate','Pupil size','Skin wound location'],0,'Respiratory rate is part of breathing assessment.'],
['Which scale describes level of consciousness?','أي مقياس يصف مستوى الوعي؟',['BMI','Glasgow Coma Scale','Pain location chart'],1,'GCS describes eye, verbal and motor responses.'],
['Which category includes peripheral perfusion?','أي فئة تشمل تقييم التروية الطرفية؟',['Exposure','Disability','Circulation'],2,'Perfusion belongs to circulation.'],
['Why reassess a patient after an intervention?','لماذا نعيد تقييم المريض بعد التدخل؟',['To avoid documentation','To detect changes and evaluate response','To replace the initial assessment entirely'],1,'Reassessment helps identify changes and response.']];
let i=0,score=0,queue=items.map((_,n)=>n),missed=[],recovery=false,locked=false,timer;const el=id=>document.getElementById(id);
function show(){clearTimeout(timer);locked=false;el('feedback').textContent='';el('next').hidden=true;el('choices').replaceChildren();el('score').textContent='First attempt: '+score+' / '+items.length;if(i>=queue.length){if(missed.length){queue=missed;missed=[];i=0;recovery=true;show();return}el('progress').textContent='Complete';el('question').textContent='All questions mastered';el('arabic').textContent='تمت الإجابة الصحيحة عن جميع الأسئلة';return}let q=items[queue[i]];el('progress').textContent=(recovery?'Review / مراجعة: ':'Quiz / اختبار: ')+(i+1)+' / '+queue.length;el('question').textContent=q[0];el('arabic').textContent=q[1];q[2].forEach((s,n)=>{let b=document.createElement('button');b.textContent=s;b.onclick=()=>{if(locked)return;locked=true;let ok=n===q[3];if(ok&&!recovery)score++;if(!ok)missed.push(queue[i]);Array.from(el('choices').children).forEach((c,j)=>{c.disabled=true;if(j===q[3])c.className='right';else if(j===n)c.className='wrong'});el('feedback').textContent=(ok?'Correct / صحيح. ':'Incorrect / خطأ. ')+q[4];el('score').textContent='First attempt: '+score+' / '+items.length;el('next').hidden=false;if(ok)timer=setTimeout(advance,3000)};el('choices').append(b)})}
function advance(){if(!locked)return;clearTimeout(timer);i++;show()}el('next').onclick=advance;el('restart').onclick=()=>{i=0;score=0;queue=items.map((_,n)=>n);missed=[];recovery=false;show()};show();</script></html>
